version: "3.8"

services:
  shelfcast:
    build: .
    container_name: shelfcast
    # OBRIGATÓRIO: a descoberta SSDP/DLNA usa multicast na rede local.
    # Sem network_mode: host o container não verá os servidores DLNA.
    network_mode: host
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATA_DIR=/app/data
      - ENABLE_METADATA=true
      - TMDB_API_KEY=${TMDB_API_KEY:-}
    volumes:
      # Persiste biblioteca, pôsteres e cache
      - shelfcast-data:/app/data
    # Porta exposta quando NÃO usar network_mode: host
    ports:
      - "8080:8080"

volumes:
  shelfcast-data:
